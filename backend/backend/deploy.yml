name: Deploy Notes App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/notes-app:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/notes-app:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/notes/data
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/notes-app:latest
            sudo docker rm -f notes || true
            sudo docker run -d \
              --name notes \
              --restart unless-stopped \
              -p 8001:8001 \
              -e SECRET_KEY=${{ secrets.JWT_SECRET }} \
              -v /opt/notes/data:/app/data \
              ${{ secrets.DOCKER_USERNAME }}/notes-app:latest