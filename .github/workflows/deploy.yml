
name: CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/backend/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/personalnotes
      VERSION: v${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/backend
          file: ./backend/backend/dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo systemctl enable --now docker
            sudo docker pull ${{ env.IMAGE }}:${{ env.VERSION }}
            sudo docker rm -f personalnotes || true
            sudo docker run -d --name personalnotes --restart unless-stopped -p 8000:8001 ${{ env.IMAGE }}:${{ env.VERSION }}
            sudo docker image prune -af
            sudo docker ps --filter name=personalnotes
